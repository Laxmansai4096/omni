name: Deploy OmniDoc AI to Azure Container Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name acrexploreai65064

      - name: Build and Push Docker Image via GitHub Runner
        run: |
          docker build -t acrexploreai65064.azurecr.io/omnidoc-fde:latest .
          docker push acrexploreai65064.azurecr.io/omnidoc-fde:latest

      - name: Update Azure Container App with Live FDE Image
        run: |
          az containerapp update \
            --name omnidoc-app-k62z7k46ybsbm \
            --resource-group rg-explore-ai \
            --image acrexploreai65064.azurecr.io/omnidoc-fde:latest
